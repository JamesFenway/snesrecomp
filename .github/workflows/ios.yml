name: iOS build
# Compiles the runner and desktop host into an unsigned iOS app from the
# project templates, as a SETUP HOST (no ROM, no generated code):
# tools/ci/ios_smoke.sh. Catches iOS-only compile and link errors before a
# port is built on a Mac with its own ROM.
on:
  pull_request:
    paths:
      - 'runner/**'
      - 'host/**'
      - 'tools/new_project/templates/**'
      - 'tools/ci/ios_smoke.sh'
      - '.github/workflows/ios.yml'
  push:
    branches: [main, fix/manual-joypad-strobe, 'claude/**']
    paths:
      - 'runner/**'
      - 'host/**'
      - 'tools/new_project/templates/**'
      - 'tools/ci/ios_smoke.sh'
      - '.github/workflows/ios.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ios:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - name: Xcode
        run: xcodebuild -version
      - name: Build the iOS smoke app
        run: bash tools/ci/ios_smoke.sh ios "$RUNNER_TEMP/ios-smoke"
